# 매시간 실행 예약 + 한 번에 70분 감시 → 다음 실행이 바로 이어받아 빈틈 없이 1분마다 감시
name: shibuya-sky-watch
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:  # 시험용: 시간대·감시 시간을 바꿔서 수동 실행
    inputs:
      start: {default: ""}
      end: {default: ""}
      minutes: {default: "70"}
      setup: {default: "", description: "텔레그램 봇에 메시지 보낸 사람의 chat id 확인용"}

concurrency: watch  # 앞 실행이 끝난 뒤 다음 실행 시작

permissions:
  contents: read
  actions: write  # 스스로 다음 실행을 시작하기 위해 필요

env:
  DATE: "2026-12-02"
  START: ${{ inputs.start || '15:20' }}
  END: ${{ inputs.end || '16:20' }}
  PEOPLE: "2"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: 텔레그램 chat id 확인(설정할 때만)
        if: inputs.setup != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/getMe" | python3 -c "import json,sys; print('BOT @' + json.load(sys.stdin)['result']['username'])"
          curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/getUpdates" | python3 -c "import json,sys; print('CHAT_IDS', {u['message']['chat']['id'] for u in json.load(sys.stdin)['result'] if 'message' in u})"
          exit 1
      - name: 날짜가 지났으면 종료
        id: datecheck
        run: if [[ "$(TZ=Asia/Tokyo date +%F)" > "$DATE" ]]; then echo "감시 날짜 지남"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python watch.py "$DATE" "$START" "$END" "$PEOPLE"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_MINUTES: ${{ inputs.minutes || '70' }}
          PYTHONIOENCODING: utf-8
      # GitHub 예약 실행은 몇 시간씩 건너뛸 때가 있어서, 끝나면 스스로 다음 실행을 시작
      - name: 다음 실행 이어서 시작
        if: always() && inputs.setup == '' && inputs.start == '' && steps.datecheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml -R "$GITHUB_REPOSITORY"
